<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta tags -->
    <title>Joel Camuenho | Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Joel Camuenho, a Software Engineer building end-to-end systems: scalable backends, modern interfaces, and AI-powered applications."
    />
    <meta name="author" content="Joel Camuenho" />
    <meta name="robots" content="index, follow" />

    <!-- Theme color (adapts to light/dark) -->
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: discovered in the HTML instead of via a CSS @import, so the
         browser can start fetching them without waiting for our stylesheet.
         Only the three weights actually used are requested. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />

    <!-- Absolute URLs (required for link previews). Live site: https://jcamuenh.me -->
    <link rel="canonical" href="https://jcamuenh.me/" />

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joel Camuenho" />
    <meta property="og:title" content="Joel Camuenho | Software Engineer" />
    <meta
      property="og:description"
      content="Software Engineer building end-to-end systems: scalable backends, modern interfaces, and AI-powered applications."
    />
    <meta property="og:url" content="https://jcamuenh.me/" />
    <meta property="og:image" content="https://jcamuenh.me/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_PT" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Joel Camuenho | Software Engineer" />
    <meta
      name="twitter:description"
      content="Software Engineer building end-to-end systems: scalable backends, modern interfaces, and AI-powered applications."
    />
    <meta name="twitter:image" content="https://jcamuenh.me/og-image.png" />

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <script type="module" crossorigin src="/assets/index-DfHo0-d0.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BAknAjtA.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply the stored theme before first paint. Without this the page paints
         light, then React flips the class, which both flashes and leaves any
         transitioned colour stuck at the light value. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var dark =
            s === "dark" ||
            (s !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </body>
</html>
